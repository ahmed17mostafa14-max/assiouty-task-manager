<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner shine -->
  <rect width="512" height="256" rx="128" fill="url(#glowGrad)"/>

  <!-- Icon Graphic: A stylized modern checkmark + task list motif -->
  <g filter="url(#shadow)">
    <!-- Clipboard card shape -->
    <rect x="116" y="116" width="280" height="290" rx="36" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>
    
    <!-- Top badge clip -->
    <rect x="206" y="96" width="100" height="40" rx="16" fill="#6366f1"/>
    
    <!-- Task lines -->
    <line x1="166" y1="190" x2="346" y2="190" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <line x1="166" y1="240" x2="310" y2="240" stroke="#a855f7" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Checkmark circle -->
    <circle cx="210" cy="320" r="32" fill="#10b981"/>
    <!-- Checkmark tick -->
    <path d="M198 320 l8 9 l18 -18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom line -->
    <line x1="260" y1="320" x2="346" y2="320" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
